[package]
name = "x_overlay"
version = "0.1.0"
authors = ["Nail Sharipov <nailxsharipov@gmail.com>"]
edition = "2024"
rust-version = "1.88"
description = "High-performance Boolean operations for orthogonal (Manhattan) polygons in Rust"
keywords = ["polygon", "geometry", "boolean-operations", "orthogonal", "clipping"]
categories = ["algorithms", "graphics", "mathematics", "no-std"]
license = "MIT"
repository = "https://github.com/iShape-Rust/xOverlay"
readme = "README.md"

[dependencies]
i_float = "^4.0.0"
i_shape = "^4.0.0"
i_key_sort = "^0.11"
rayon = { optional = true, version = "^1.11" }
#i_float = { path = "../iFloat" }
#i_shape = { path = "../iShape" }
#i_key_sort = { path = "../../iKeySort/iKeySort" }

[features]
default = ["allow_multithreading"]
allow_multithreading = ["dep:rayon", "i_key_sort/allow_multithreading"]


[dev-dependencies]
serde = { version = "^1.0", features = ["derive"] }
serde_json = "^1.0"
rand = { version = "^0.10.0", features = [] }
#i_overlay = { path = "../../iOverlay/iOverlay" }
i_overlay = "^8.0.0"
