[package]
name = "x_overlay"
version = "0.1.0"
authors = ["Nail Sharipov <nailxsharipov@gmail.com>"]
edition = "2024"
description = "Boolean Operations for 45 degrees geometry"
license = "MIT"
repository = "https://github.com/iShape-Rust/xOverlay"
readme = "README.md"

[dependencies]
i_float = "^1.16.0"
i_shape = "^1.18.0"
#i_key_sort = "~0.6.0"
i_tree = "~0.18.0"


rayon = { optional = true, version = "^1.11" }
#i_float = { path = "../iFloat" }
#i_shape = { path = "../iShape" }
#i_key_sort = { path = "../../iKeySort/iKeySort" }
i_key_sort = "^0.10.1"

[features]
default = ["allow_multithreading"]
allow_multithreading = ["dep:rayon", "i_key_sort/allow_multithreading"]


[dev-dependencies]
serde = { version = "^1.0", features = ["derive"] }
serde_json = "^1.0"
rand = { version = "^0.10.0", features = [] }
i_overlay = { path = "../../iOverlay/iOverlay" }
#i_overlay = "^4.1.1"
