name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: xOverlay

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --all-features

      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --all-features

      - name: Verify release package
        run: cargo package

      - name: Check benchmark project
        working-directory: .
        run: cargo check --manifest-path performance/benchmark/Cargo.toml --all-targets

  msrv:
    name: MSRV 1.88
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: xOverlay

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Rust 1.88
        run: rustup toolchain install 1.88.0 --profile minimal

      - name: Test all features
        run: cargo +1.88.0 test --all-features

      - name: Test without default features
        run: cargo +1.88.0 test --no-default-features

  portable:
    name: no_std and wasm
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: xOverlay

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install stable Rust and wasm target
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add wasm32-unknown-unknown --toolchain stable

      - name: Test without default features
        run: cargo test --no-default-features

      - name: Check wasm with all features
        run: cargo check --lib --target wasm32-unknown-unknown --all-features

      - name: Check wasm without default features
        run: cargo check --lib --target wasm32-unknown-unknown --no-default-features
