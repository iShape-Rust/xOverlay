<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Reproducible iOverlay, xOverlay, and Boost Polygon 90 benchmarks for orthogonal geometry.">
  <title>Orthogonal Overlay Benchmarks</title>
  <style>:root {
  color-scheme: light;
  --ink: #18201e;
  --muted: #68716e;
  --paper: #f5f2ea;
  --surface: #fffdf8;
  --line: #d7d4ca;
  --acid: #d8ff4f;
  --blue: #307cf6;
  --red: #ef4444;
  --orange: #f28c28;
  --violet: #8557d9;
  --teal: #058b7d;
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; color: var(--ink); background: var(--paper); }
a { color: inherit; }
button { font: inherit; }

.page-title {
  padding: clamp(20px, 3vw, 38px) clamp(22px, 6vw, 96px);
  background: var(--surface);
  border-bottom: 1px solid var(--line);
}

.title-grid {
  max-width: 1500px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: max-content minmax(0, 1fr);
  align-items: center;
  gap: clamp(28px, 4vw, 64px);
}

h1 { margin: 0; max-width: none; white-space: nowrap; font-size: clamp(24px, 3.2vw, 42px); line-height: 1.04; letter-spacing: -.04em; font-weight: 770; }

.run-card { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); margin: 0; border-top: 1px solid var(--line); border-left: 1px solid var(--line); background: #faf8f2; }
.run-card div { min-width: 0; padding: 10px 12px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.run-card dt { margin-bottom: 4px; color: #939b98; font-size: 10px; text-transform: uppercase; letter-spacing: .12em; }
.run-card dd { margin: 0; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; overflow-wrap: anywhere; }

.controls-wrap { position: sticky; top: 0; z-index: 10; background: #f5f2eaf2; backdrop-filter: blur(14px); border-bottom: 1px solid var(--line); }
.controls { max-width: 1500px; margin: 0 auto; padding: 20px clamp(20px, 5vw, 72px); display: flex; align-items: end; gap: 32px; }
.control-label { display: block; margin-bottom: 8px; color: var(--muted); font-size: 10px; font-weight: 800; letter-spacing: .13em; text-transform: uppercase; }
.segmented { display: flex; border: 1px solid var(--ink); }
.segmented button { border: 0; border-right: 1px solid var(--ink); padding: 9px 15px; background: transparent; cursor: pointer; }
.segmented button:last-child { border-right: 0; }
.segmented button[aria-pressed="true"] { color: var(--ink); background: var(--acid); font-weight: 750; }
.metric-key { margin-left: auto; padding-bottom: 8px; color: var(--muted); font-size: 12px; }
.metric-dot { display: inline-block; width: 8px; height: 8px; margin-right: 8px; border-radius: 50%; background: var(--teal); }

.suite { max-width: 1500px; margin: 0 auto; padding: 76px clamp(20px, 5vw, 72px) 120px; }
.scenario { display: grid; grid-template-columns: minmax(180px, 220px) minmax(0, 1fr); gap: clamp(28px, 4vw, 64px); padding: 0 0 96px; margin-bottom: 96px; border-bottom: 1px solid var(--line); }
.scenario:last-child { margin-bottom: 0; }
.scenario-copy { align-self: start; position: sticky; top: 118px; width: 100%; max-width: 220px; }
.scenario h2 { display: flex; align-items: baseline; gap: 6px; margin: 0; font-size: clamp(16px, 1.2vw, 18px); line-height: 1.2; letter-spacing: -.01em; font-weight: 700; }
.scenario-index { flex: none; color: var(--teal); font: inherit; letter-spacing: inherit; }
.scenario-index::after { content: "."; }
.scenario-description { margin: 10px 0 0; color: var(--muted); font-size: 14px; line-height: 1.55; }
.input-polygons { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-top: 12px; padding: 12px 14px; border-left: 3px solid var(--teal); color: var(--muted); background: var(--surface); font-size: 11px; line-height: 1.45; }
.input-polygons strong { color: var(--ink); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; }
.input-polygons span:first-of-type { color: var(--ink); font-family: ui-monospace, monospace; }
.operation { display: inline-block; margin-top: 8px; padding: 6px 9px; border: 1px solid var(--ink); font: 700 11px ui-monospace, monospace; text-transform: uppercase; }
.illustration { display: block; width: 100%; aspect-ratio: 1 / 1; margin-top: 28px; object-fit: contain; background: var(--surface); border: 1px solid var(--line); }

.result-panel { min-width: 0; }
.warning { margin: 0 0 18px; padding: 12px 14px; color: #73410b; background: #fff0ce; border-left: 4px solid var(--orange); font-size: 13px; line-height: 1.45; }
.chart-shell { position: relative; min-height: 390px; background: var(--surface); border: 1px solid var(--line); }
.chart-shell canvas { display: block; width: 100%; height: 390px; }
.legend { display: flex; flex-wrap: wrap; gap: 10px 18px; margin: 18px 0 24px; }
.legend-item { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; }
.legend-line { width: 23px; border-top: 3px solid; }
.legend-line.dashed { border-top-style: dashed; }

.table-wrap { width: 100%; overflow-x: auto; border: 1px solid var(--line); background: var(--surface); }
table { width: 100%; border-collapse: collapse; font-size: 12px; }
th, td { padding: 12px 14px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
thead th { color: var(--muted); background: #f2efe7; font-size: 10px; letter-spacing: .07em; text-transform: uppercase; }
tbody tr:last-child td { border-bottom: 0; }
.empty { padding: 70px 24px; color: var(--muted); text-align: center; background: var(--surface); border: 1px solid var(--line); }

@media (max-width: 900px) {
  .title-grid, .scenario { grid-template-columns: 1fr; }
  .title-grid { gap: 20px; }
  .scenario-copy { position: static; }
  .controls { align-items: stretch; flex-wrap: wrap; }
  .metric-key { width: 100%; margin-left: 0; }
}

@media (max-width: 560px) {
  .page-title { padding-inline: 20px; }
  h1 { font-size: clamp(16px, 5vw, 28px); }
  .run-card { grid-template-columns: 1fr; }
  .controls { gap: 16px; }
  .segmented button { padding-inline: 11px; }
  .scenario { margin-bottom: 62px; padding-bottom: 62px; }
  .chart-shell, .chart-shell canvas { min-height: 320px; height: 320px; }
}

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
}
</style>
</head>

  <header class="page-title" id="top">
    <div class="title-grid">
      <div>
        <h1>Orthogonal Overlay Benchmarks</h1>
      </div>
      <dl class="run-card" id="run-metadata" aria-label="Benchmark run metadata"></dl>
    </div>
  </header>

  <main>
    <section class="controls-wrap" aria-label="Result filters">
      <div class="controls">
        <div>
          <span class="control-label">Coordinate</span>
          <div class="segmented" id="coordinate-filter" role="group" aria-label="Coordinate type">
            <button type="button" data-value="i32" aria-pressed="true">i32</button>
            <button type="button" data-value="i64" aria-pressed="false">i64</button>
          </div>
        </div>
        <div>
          <span class="control-label">Output</span>
          <div class="segmented" id="output-filter" role="group" aria-label="Output kind">
            <button type="button" data-value="shapes" aria-pressed="true">Shapes</button>
            <button type="button" data-value="contours" aria-pressed="false">Contours only</button>
          </div>
        </div>
        <div class="metric-key" aria-label="Chart metric">
          <span class="metric-dot"></span>
          Median end-to-end time · log scale
        </div>
      </div>
    </section>

    <section class="suite" id="suite" aria-live="polite"></section>

  </main>

  <script>(() => {
  "use strict";
  const report = JSON.parse(document.getElementById("benchmark-data").textContent);
  const state = { coordinate: "i32", output: "shapes" };
  const colors = {
    "iOverlay · single": "#307cf6",
    "iOverlay · multi": "#8557d9",
    "xOverlay · single": "#058b7d",
    "xOverlay · multi": "#ef4444",
    "Boost Polygon 90 · single": "#f28c28"
  };

  const seriesName = measurement => {
    const mode = measurement.execution === "multi_thread" ? "multi" : "single";
    return `${measurement.implementation} · ${mode}`;
  };

  const formatTime = ns => {
    if (ns < 1_000) return `${ns.toFixed(0)} ns`;
    if (ns < 1_000_000) return `${(ns / 1_000).toFixed(ns < 10_000 ? 2 : 1)} µs`;
    if (ns < 1_000_000_000) return `${(ns / 1_000_000).toFixed(ns < 10_000_000 ? 2 : 1)} ms`;
    if (ns < 60_000_000_000) return `${(ns / 1_000_000_000).toFixed(2)} s`;
    const minutes = ns / 60_000_000_000;
    return `${Number.isInteger(minutes) ? minutes.toFixed(0) : minutes.toFixed(1)} min`;
  };

  const escapeHtml = text => String(text).replace(/[&<>"]/g, char => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;"
  })[char]);

  function renderMetadata() {
    const metadata = report.metadata;
    const rows = [
      ["Machine", metadata.cpu],
      ["Versions", `iO ${metadata.i_overlay_version} · xO ${metadata.x_overlay_version} · Boost ${metadata.boost_version}`]
    ];
    document.getElementById("run-metadata").innerHTML = rows.map(([key, value]) =>
      `<div><dt>${escapeHtml(key)}</dt><dd>${escapeHtml(value || "unknown")}</dd></div>`
    ).join("");
  }

  function setupControls(id, key) {
    document.querySelectorAll(`#${id} button`).forEach(button => {
      button.addEventListener("click", () => {
        state[key] = button.dataset.value;
        document.querySelectorAll(`#${id} button`).forEach(candidate =>
          candidate.setAttribute("aria-pressed", String(candidate === button))
        );
        renderSuite();
      });
    });
  }

  function scenarioMeasurements(id) {
    return report.measurements.filter(measurement =>
      measurement.scenario === id &&
      measurement.coordinate_type === state.coordinate &&
      measurement.output_kind === state.output
    );
  }

  function renderSuite() {
    const suite = document.getElementById("suite");
    suite.innerHTML = report.scenarios.map((scenario, index) => {
      const measurements = scenarioMeasurements(scenario.id);
      const warning = measurements.find(item => item.warning)?.warning;
      const input = scenario.input_polygons;
      const inputNote = input ? `
        <aside class="input-polygons" aria-label="Input polygon count">
          <strong>Input polygons</strong>
          <span>${escapeHtml(input.formula)}</span>
          <span>At max N = ${input.max_n.toLocaleString()}. Polygons = ${input.total.toLocaleString()}.</span>
        </aside>` : "";
      return `
        <article class="scenario" id="${escapeHtml(scenario.id)}">
          <div class="scenario-copy">
            <h2><span class="scenario-index">${String(index + 1).padStart(2, "0")}</span>${escapeHtml(scenario.label)}</h2>
            <p class="scenario-description">${escapeHtml(scenario.description)}</p>
            <span class="operation">${escapeHtml(scenario.operation)}</span>
            <img class="illustration" src="${escapeHtml(scenario.illustration)}" alt="${escapeHtml(scenario.label)} subject and clip geometry">
          </div>
          <div class="result-panel">
            ${warning ? `<p class="warning">${escapeHtml(warning)}</p>` : ""}
            ${measurements.length ? renderResults(scenario.id, measurements) : `<div class="empty">Not measured in this run.</div>`}
            ${inputNote}
          </div>
        </article>`;
    }).join("");
    report.scenarios.forEach(scenario => {
      const measurements = scenarioMeasurements(scenario.id);
      if (measurements.length) drawChart(document.getElementById(`chart-${scenario.id}`), measurements);
    });
  }

  function renderResults(id, measurements) {
    const names = [...new Set(measurements.map(seriesName))];
    const nValues = [...new Set(measurements.map(item => item.n))].sort((a, b) => a - b);
    const tableRows = nValues.map(n => {
      const cells = names.map(name => {
        const item = measurements.find(candidate => candidate.n === n && seriesName(candidate) === name);
        if (!item) return "<td>—</td>";
        if (item.timing.timed_out) {
          return `<td title="Timed out before output was materialized">&gt; ${formatTime(item.timing.median_ns)}</td>`;
        }
        const detail = `${item.output.contours.toLocaleString()} contours · ${item.output.points.toLocaleString()} points`;
        return `<td title="${escapeHtml(detail)}">${formatTime(item.timing.median_ns)}</td>`;
      }).join("");
      return `<tr><td>${n.toLocaleString()}</td>${cells}</tr>`;
    }).join("");
    return `
      <div class="chart-shell"><canvas id="chart-${escapeHtml(id)}" role="img" aria-label="${escapeHtml(id)} performance chart"></canvas></div>
      <div class="legend">${names.map(name => `<span class="legend-item"><span class="legend-line ${name.startsWith("Boost") ? "dashed" : ""}" style="border-color:${colors[name] || "#18201e"}"></span>${escapeHtml(name)}</span>`).join("")}</div>
      <div class="table-wrap"><table>
        <thead><tr><th>Generator N</th>${names.map(name => `<th>${escapeHtml(name)}</th>`).join("")}</tr></thead>
        <tbody>${tableRows}</tbody>
      </table></div>`;
  }

  function drawChart(canvas, measurements) {
    const bounds = canvas.getBoundingClientRect();
    const ratio = window.devicePixelRatio || 1;
    canvas.width = Math.max(1, Math.round(bounds.width * ratio));
    canvas.height = Math.max(1, Math.round(bounds.height * ratio));
    const context = canvas.getContext("2d");
    context.scale(ratio, ratio);
    const width = bounds.width;
    const height = bounds.height;
    const padding = { left: 64, right: 22, top: 28, bottom: 46 };
    const plotWidth = width - padding.left - padding.right;
    const plotHeight = height - padding.top - padding.bottom;
    const xs = measurements.map(item => Math.log2(item.n));
    const ys = measurements.map(item => Math.log10(Math.max(1, item.timing.median_ns)));
    const xMin = Math.min(...xs), xMax = Math.max(...xs);
    const yMin = Math.floor(Math.min(...ys)), yMax = Math.ceil(Math.max(...ys));
    const xScale = value => padding.left + ((Math.log2(value) - xMin) / Math.max(1, xMax - xMin)) * plotWidth;
    const yScale = value => padding.top + (1 - (Math.log10(Math.max(1, value)) - yMin) / Math.max(1, yMax - yMin)) * plotHeight;

    context.font = "11px ui-monospace, monospace";
    context.fillStyle = "#68716e";
    context.strokeStyle = "#dedbd2";
    context.lineWidth = 1;
    for (let power = yMin; power <= yMax; power++) {
      const y = yScale(10 ** power);
      context.beginPath(); context.moveTo(padding.left, y); context.lineTo(width - padding.right, y); context.stroke();
      context.textAlign = "right"; context.textBaseline = "middle";
      context.fillText(formatTime(10 ** power), padding.left - 10, y);
    }
    const nValues = [...new Set(measurements.map(item => item.n))].sort((a, b) => a - b);
    nValues.forEach(n => {
      const x = xScale(n);
      context.textAlign = "center"; context.textBaseline = "top";
      context.fillText(String(n), x, height - padding.bottom + 12);
    });
    context.textAlign = "right"; context.fillText("Generator N", width - padding.right, height - 13);

    [...new Set(measurements.map(seriesName))].forEach(name => {
      const series = measurements.filter(item => seriesName(item) === name).sort((a, b) => a.n - b.n);
      context.strokeStyle = colors[name] || "#18201e";
      context.fillStyle = context.strokeStyle;
      context.lineWidth = 2.5;
      context.setLineDash(name.startsWith("Boost") ? [7, 5] : []);
      context.beginPath();
      series.forEach((item, index) => {
        const x = xScale(item.n), y = yScale(item.timing.median_ns);
        if (index === 0) context.moveTo(x, y); else context.lineTo(x, y);
      });
      context.stroke();
      context.setLineDash([]);
      series.forEach(item => {
        const x = xScale(item.n), y = yScale(item.timing.median_ns);
        context.beginPath(); context.arc(x, y, 3.5, 0, Math.PI * 2); context.fill();
      });
    });
  }

  let resizeTimer;
  window.addEventListener("resize", () => {
    window.clearTimeout(resizeTimer);
    resizeTimer = window.setTimeout(renderSuite, 120);
  });
  renderMetadata();
  setupControls("coordinate-filter", "coordinate");
  setupControls("output-filter", "output");
  renderSuite();
})();
</script>
