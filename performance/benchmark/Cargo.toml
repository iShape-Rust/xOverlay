[package]
name = "xoverlay-benchmark"
version = "0.1.0"
edition = "2024"
publish = false

[profile.release]
opt-level = 3
codegen-units = 1
lto = false

[dependencies]
i_overlay = { path = "../../../iOverlay/iOverlay", features = ["allow_multithreading"] }
x_overlay = { path = "../../xOverlay", features = ["allow_multithreading"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[[bin]]
name = "overlay-benchmark"
path = "src/main.rs"

[[bin]]
name = "generate-svgs"
path = "src/bin/generate_svgs.rs"

[[bin]]
name = "render-report"
path = "src/bin/render_report.rs"
